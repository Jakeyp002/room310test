<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room310 interactive graph</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #fffdf7; }
      #graph { width: 100%; height: 100%; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; color: #292925; background: #fffdf7; font-size: 14px; }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="graph" aria-label="Interactive Desmos graph"></div>
    <div id="status" role="status">Loading interactive graph…</div>
    <script src="/study-graph-runner.js"></script>
  </body>
</html>
