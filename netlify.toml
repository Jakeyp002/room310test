[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/run"
  to = "/.netlify/functions/run"
  status = 200

[[redirects]]
  from = "/api/graphs/import"
  to = "/.netlify/functions/graph-import"
  status = 200

[[redirects]]
  from = "/admin/graphs"
  to = "/admin-graphs.html"
  status = 200

[[redirects]]
  from = "/graphs/*"
  to = "/graph.html"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/admin-login.html"
  status = 200

[[redirects]]
  from = "/admin/games"
  to = "/admin-games.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
